name: Build desktop app

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create (e.g. v1.0.0). Leave empty to only build.'
        required: false
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: bash
        run: npm version "$(echo "${{ inputs.version || github.ref_name }}" | sed 's/^v//')" --no-git-tag-version --allow-same-version
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: float-timer-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -R artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Float Timer $TAG" --generate-notes
