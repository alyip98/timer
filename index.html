<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Float Timer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Float Timer</h1>
      <div class="win-btns"><button id="win-min" title="Minimize">–</button><button id="win-close" title="Close">×</button></div>
      <div class="tabs" role="tablist">
        <button role="tab" data-mode="timer" aria-selected="true">Timer</button>
        <button role="tab" data-mode="stopwatch" aria-selected="false">Stopwatch</button>
      </div>
    </header>

    <section class="display">
      <input class="time" id="time" value="00:00" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Time (click to edit)">
      <div class="progress"><div class="bar" id="bar"></div></div>
    </section>

    <section class="setter" id="setter">
      <div class="presets">
        <button data-min="1">+1m</button>
        <button data-min="5">+5m</button>
        <button data-min="10">+10m</button>
        <button data-min="25">+25m</button>
        <button data-min="60">+1h</button>
      </div>
    </section>

    <section class="controls">
      <button class="primary" id="start">Start</button>
      <button id="clear">Clear</button>
    </section>

    <button class="sound" id="sound" aria-pressed="true" title="Toggle alarm sound">🔔 Alarm sound: on</button>
    <button class="float" id="float">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="8" height="6" rx="1" class="fill"/></svg>
      Always on top
    </button>
    <p class="note" id="note"></p>
    <p class="keys"><kbd>Space</kbd> start / pause · <kbd>R</kbd> clear · click the time to type</p>
    <div class="hotkey" id="hotkey" hidden>
      <div class="hotkey-row"><span>Show/hide shortcut</span><button id="hotkey-btn" title="Click, then press a new shortcut"></button></div>
      <small id="hotkey-hint"></small>
    </div>
    <button class="install" id="install" hidden>Install app</button>
  </main>

  <div id="mini-root" hidden></div>

  <template id="mini-tpl">
    <div class="mini">
      <div class="mini-fill"></div>
      <input class="time mini-time" value="05:00" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Time (click to edit)">
      <button class="mini-start" title="Start / pause">▶</button>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
